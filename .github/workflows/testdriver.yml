name: TestDriver AI E2E Tests

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  testdriver:
    if: contains(github.event.comment.body, '@testdriverai')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run TestDriver AI
        uses: testdriverai/action@main
        with:
          api-key: ${{ secrets.TESTDRIVER_API_KEY }}
