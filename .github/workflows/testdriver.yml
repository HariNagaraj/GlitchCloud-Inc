name: TestDriver AI E2E Tests

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  testdriver:
    if: contains(github.event.issue.body, '@testdriverai') || contains(github.event.comment.body, '@testdriverai')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run TestDriver AI
        uses: testdriverai/action@main
        with:
          key: ${{ secrets.TESTDRIVER_API_KEY }}
          pr: true
